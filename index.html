<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Une idée, un devoir, du code ou une question compliquée ? Écris naturellement en derja tunisienne, en arabe, en français ou en anglais.">
<title>ASSTRA AI — Your intelligence, amplified</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><path d='M24 3L30 18L45 24L30 30L24 45L18 30L3 24L18 18Z' fill='%236857f5'/><circle cx='36' cy='10' r='3' fill='%23a855f7'/></svg>">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
:root {
  --primary: #6857f5;
  --primary-dark: #5141df;
  --purple-light: #f1efff;
  --text: #25243a;
  --muted: #9290a3;
  --border: #e9e8f1;
  --background: #ffffff;
  --sidebar: #faf9fd;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background: var(--background);
  height: 100dvh;
  overflow: hidden;
}
button, textarea { font: inherit; }
button { cursor: pointer; }
.app { display: flex; height: 100dvh; overflow: hidden; }
.sidebar {
  width: 265px; flex-shrink: 0; display: flex; flex-direction: column;
  padding: 17px 13px; background: var(--sidebar); border-right: 1px solid var(--border); z-index: 10;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 5px 7px 23px; }
.logo {
  width: 42px; height: 42px; display: grid; place-items: center;
  border-radius: 14px; background: linear-gradient(140deg, #6252ee, #a855f7);
  box-shadow: 0 6px 17px #7564f53a;
}
.logo svg { width: 31px; height: 31px; }
.brand-name {
  font-size: 18px; font-weight: 850;
  background: linear-gradient(100deg, #6252ee, #a855f7);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.new-chat {
  display: flex; justify-content: center; align-items: center; gap: 9px;
  width: 100%; padding: 12px; border-radius: 12px; color: var(--primary-dark);
  background: white; border: 1px solid #e4dfff; font-size: 13px; font-weight: 700;
}
.new-chat:hover { background: var(--purple-light); }
.section-label { margin: 26px 8px 11px; color: #a09caf; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.history-item { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 10px; cursor: pointer; color: #69677c; font-size: 12px; }
.history-item:hover { background: #f1efff; }
.history-item.active { background: #eeebff; color: var(--primary-dark); }
.history-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.delete-chat { border: 0; background: transparent; color: #aaa; font-size: 17px; }

.main { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
.header {
  height: 62px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; border-bottom: 1px solid var(--border); background: white;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-title { font-size: 14px; font-weight: 800; }
.model-label { padding: 5px 9px; border-radius: 20px; background: #f3f0ff; color: #7261d9; font-size: 10px; }
.online { display: flex; align-items: center; gap: 6px; color: #858398; font-size: 11px; }
.dot { width: 7px; height: 7px; background: #25c685; border-radius: 50%; }
.menu-btn { display: none; width: 37px; height: 37px; border: 0; border-radius: 10px; color: var(--primary); background: var(--purple-light); font-size: 20px; }

.chat { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 18px 35px; scroll-behavior: smooth; }
.welcome { max-width: 680px; margin: 9vh auto 0; text-align: center; }
.welcome-logo {
  width: 68px; height: 68px; display: grid; place-items: center; margin: 0 auto 22px;
  border-radius: 23px; background: linear-gradient(140deg, #6252ee, #a855f7);
  box-shadow: 0 12px 34px #7564f52d;
}
.welcome h1 { font-size: clamp(25px, 4vw, 36px); font-weight: 800; }
.gradient-text { background: linear-gradient(100deg, #6657f5, #b053ef); -webkit-background-clip: text; background-clip: text; color: transparent; }
.welcome p { max-width: 460px; margin: 13px auto 29px; color: var(--muted); font-size: 13px; line-height: 1.8; }
.suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
.suggestion { padding: 15px; background: white; border: 1px solid var(--border); border-radius: 14px; transition: .2s; }
.suggestion:hover { border-color: #c9c0ff; background: #fcfbff; }

.message-row { width: 100%; max-width: 790px; margin: 0 auto 25px; display: flex; align-items: flex-start; gap: 12px; }
.message-row.user-row { justify-content: flex-end; }
.avatar { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 11px; font-size: 14px; }
.ai-avatar { color: white; background: linear-gradient(140deg, #6657f5, #a855f7); }
.user-avatar { color: #6657f5; background: #eeebff; }
.message { max-width: calc(100% - 44px); font-size: 14px; line-height: 1.8; overflow-wrap: anywhere; }
.message.user { padding: 11px 15px; border-radius: 17px 17px 4px 17px; background: #f0eeff; }
.message.assistant { flex: 1; }
.message-image { display: block; max-width: min(280px, 100%); max-height: 300px; object-fit: contain; margin-top: 9px; border: 1px solid var(--border); border-radius: 12px; }

.composer-area { padding: 12px 18px max(13px, env(safe-area-inset-bottom)); background: white; }
.composer-wrap { max-width: 790px; margin: 0 auto; position: relative; }
.image-preview { display: none; align-items: center; gap: 10px; padding: 8px; margin-bottom: 10px; background: #f5f2ff; border-radius: 12px; }
.image-preview img { width: 47px; height: 47px; object-fit: cover; border-radius: 8px; }
.preview-label { flex: 1; color: var(--primary-dark); font-size: 12px; }
.remove-image { width: 29px; height: 29px; border: 0; border-radius: 8px; background: white; color: #d94662; }

.composer {
  display: flex; align-items: flex-end; gap: 8px; padding: 8px 9px;
  background: white; border: 1px solid #dedce9; border-radius: 18px; box-shadow: 0 4px 20px #24204a08;
}
.composer textarea { flex: 1; max-height: 150px; resize: none; padding: 10px 3px; border: 0; outline: 0; background: transparent; font-size: 14px; }
.composer-plus { width: 38px; height: 38px; border: 0; border-radius: 50%; background: #f3f0ff; color: var(--primary); font-size: 22px; display: grid; place-items: center; }
.send-btn { width: 39px; height: 39px; border: 0; border-radius: 12px; background: linear-gradient(140deg, #6657f5, #8b5cf6); color: white; font-size: 22px; display: grid; place-items: center; }

/* Plus Popup Menu */
.plus-menu {
  display: none; position: absolute; bottom: 70px; left: 0; width: 260px;
  background: white; border: 1px solid var(--border); border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12); padding: 10px; z-index: 100;
  flex-direction: column; gap: 5px;
}
.plus-menu.open { display: flex; }
.plus-menu button {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px;
  border: 0; background: transparent; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text); text-align: left;
}
.plus-menu button:hover { background: var(--purple-light); color: var(--primary-dark); }
.plus-menu span { font-size: 18px; width: 24px; text-align: center; }

.disclaimer { margin-top: 9px; color: #a09eac; font-size: 10px; text-align: center; }
.overlay { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 48 48" fill="none"><path d="M24 3L30 18L45 24L30 30L24 45L18 30L3 24L18 18Z" fill="white"/><circle cx="36" cy="10" r="3" fill="#DDD6FE"/></svg>
      </div>
      <div>
        <div class="brand-name">ASSTRA AI</div>
        <div class="brand-sub" style="font-size:10px;color:var(--muted)">Intelligence, autrement.</div>
      </div>
    </div>
    <button class="new-chat" id="newChatBtn">＋ Nouvelle discussion</button>
    <div class="section-label">Discussions récentes</div>
    <div class="history" id="historyList"></div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="header-left">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="header-title">ASSTRA AI</div>
        <span class="model-label">Asstra AI 1.5 Flash ⚡</span>
      </div>
      <div class="online"><span class="dot"></span> Prêt à vous aider</div>
    </header>

    <section class="chat" id="chatMessages" aria-live="polite"></section>

    <footer class="composer-area">
      <div class="composer-wrap">
        <!-- Plus Popup Menu -->
        <div class="plus-menu" id="plusMenu">
          <button id="menuPhotos"><span>🖼️</span> Photos / Galerie</button>
          <button id="menuCamera"><span>📷</span> Appareil photo</button>
          <button id="menuFiles"><span>📁</span> Fichiers</button>
          <button id="menuCreateImg"><span>🎨</span> Créer des images</button>
          <button id="menuStudy"><span>📚</span> Apprentissage guidé</button>
        </div>

        <div class="image-preview" id="imagePreview">
          <img id="previewImg" alt="Image sélectionnée">
          <div class="preview-label">Image prête à envoyer</div>
          <button class="remove-image" id="removeImageBtn">×</button>
        </div>

        <div class="composer">
          <button class="composer-plus" id="imageBtn" title="Ajouter">＋</button>
          <!-- Hidden inputs -->
          <input type="file" id="imageInput" accept="image/*" hidden>
          <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
          <input type="file" id="fileInput" accept=".pdf,.txt,.doc,.docx" hidden>

          <textarea id="userInput" rows="1" maxlength="20000" placeholder="Poser une question..."></textarea>
          <button class="send-btn" id="sendBtn">↑</button>
        </div>
        <div class="disclaimer">ASSTRA AI peut faire des erreurs. Vérifiez les informations importantes.</div>
      </div>
    </footer>
  </main>
</div>

<script>
"use strict";

let conversations = [];
let activeConversationId = null;
let selectedImage = null;
let isSending = false;

const $ = id => document.getElementById(id);
const chatMessages = $("chatMessages");
const historyList = $("historyList");
const userInput = $("userInput");
const sendBtn = $("sendBtn");
const imageInput = $("imageInput");
const cameraInput = $("cameraInput");
const fileInput = $("fileInput");
const imageBtn = $("imageBtn");
const plusMenu = $("plusMenu");
const imagePreview = $("imagePreview");
const previewImg = $("previewImg");
const removeImageBtn = $("removeImageBtn");
const sidebar = $("sidebar");
const overlay = $("overlay");

function makeId() {
  return window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function getActive() {
  return conversations.find(c => c.id === activeConversationId);
}

async function loadConversationsFromSupabase() {
  try {
    const res = await fetch('/api/ai');
    const data = await res.json();
    if (data.conversations && Array.isArray(data.conversations)) {
      conversations = data.conversations.map(conv => ({
        id: conv.id,
        title: conv.title || "Nouvelle discussion",
        messages: (conv.messages || []).map(m => ({
          role: m.role === 'assistant' ? 'model' : m.role,
          text: m.content || m.text || '',
          image: m.image || null
        })),
        updatedAt: new Date(conv.updated_at || Date.now()).getTime()
      }));
      conversations.sort((a, b) => b.updatedAt - a.updatedAt);
    }
  } catch (err) {
    console.warn("Erreur chargement:", err);
  }
  if (conversations.length === 0) newConversation(false);
  else if (!activeConversationId) activeConversationId = conversations[0].id;
  saveAndRender();
}

function clearImage() {
  selectedImage = null;
  if (imageInput) imageInput.value = "";
  if (cameraInput) cameraInput.value = "";
  if (fileInput) fileInput.value = "";
  if (previewImg) previewImg.removeAttribute("src");
  if (imagePreview) imagePreview.style.display = "none";
}

// Toggle Plus Menu
if (imageBtn && plusMenu) {
  imageBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    plusMenu.classList.toggle("open");
  });
  document.addEventListener("click", (e) => {
    if (!plusMenu.contains(e.target) && e.target !== imageBtn) {
      plusMenu.classList.remove("open");
    }
  });
}

// Menu Actions
if ($("menuPhotos")) {
  $("menuPhotos").onclick = () => { plusMenu.classList.remove("open"); imageInput.click(); };
}
if ($("menuCamera")) {
  $("menuCamera").onclick = () => { plusMenu.classList.remove("open"); cameraInput.click(); };
}
if ($("menuFiles")) {
  $("menuFiles").onclick = () => { plusMenu.classList.remove("open"); fileInput.click(); };
}
if ($("menuCreateImg")) {
  $("menuCreateImg").onclick = () => { plusMenu.classList.remove("open"); userInput.value = "Crée une image : "; userInput.focus(); };
}
if ($("menuStudy")) {
  $("menuStudy").onclick = () => { plusMenu.classList.remove("open"); userInput.value = "Aide-moi étape par étape sur : "; userInput.focus(); };
}

// Handle file/image selections
function handleFileSelect(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    selectedImage = e.target.result; // Base64
    if (previewImg) previewImg.src = selectedImage;
    if (imagePreview) imagePreview.style.display = "flex";
  };
  reader.readAsDataURL(file);
}

if (imageInput) imageInput.onchange = (e) => handleFileSelect(e.target.files[0]);
if (cameraInput) cameraInput.onchange = (e) => handleFileSelect(e.target.files[0]);
if (fileInput) fileInput.onchange = (e) => {
  const f = e.target.files[0];
  if (f) { userInput.value = "Analyse ce fichier : " + f.name; resizeInput(); }
};

if (removeImageBtn) removeImageBtn.onclick = clearImage;

function newConversation(render = true) {
  if (isSending) return;
  activeConversationId = null;
  clearImage();
  if (render) saveAndRender();
  userInput.focus();
}

function openConversation(id) {
  if (isSending) return;
  activeConversationId = id;
  clearImage();
  saveAndRender();
}

function saveAndRender() {
  if (historyList) {
    historyList.replaceChildren();
    conversations.forEach(c => {
      const item = document.createElement("div");
      item.className = "history-item" + (c.id === activeConversationId ? " active" : "");
      item.innerHTML = `<span>◷</span><span class="history-name">${c.title || "Discussion"}</span>`;
      item.onclick = () => openConversation(c.id);
      historyList.appendChild(item);
    });
  }
  if (chatMessages) {
    chatMessages.replaceChildren();
    const c = getActive();
    if (!c || !c.messages || c.messages.length === 0) {
      addWelcome();
    } else {
      c.messages.forEach(appendMessage);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  }
}

function addWelcome() {
  const welcome = document.createElement("div");
  welcome.className = "welcome";
  welcome.innerHTML = `
    <div class="welcome-logo">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 3L30 18L45 24L30 30L24 45L18 30L3 24L18 18Z" fill="white"/><circle cx="36" cy="10" r="3" fill="#DDD6FE"/></svg>
    </div>
    <h1>Bonjour, bienvenue sur<br><span class="gradient-text">ASSTRA AI</span> 🌟</h1>
    <p>Votre espace intelligent pour apprendre, créer, résoudre des problèmes et explorer de nouvelles idées.</p>
  `;
  chatMessages.appendChild(welcome);
}

function appendMessage(m) {
  const row = document.createElement("div");
  row.className = "message-row" + (m.role === "user" ? " user-row" : "");
  
  const avatar = document.createElement("div");
  avatar.className = "avatar " + (m.role === "user" ? "user-avatar" : "ai-avatar");
  avatar.textContent = m.role === "user" ? "●" : "✦";

  const bubble = document.createElement("div");
  bubble.className = "message " + (m.role === "user" ? "user" : "assistant");

  if (m.text) {
    if (m.role === "user") {
      bubble.textContent = m.text;
      bubble.style.whiteSpace = "pre-wrap";
    } else {
      const raw = window.marked ? marked.parse(m.text, { breaks: true }) : m.text;
      bubble.innerHTML = window.DOMPurify ? DOMPurify.sanitize(raw) : raw;
    }
  }

  if (m.image) {
    const img = document.createElement("img");
    img.className = "message-image";
    img.src = m.image;
    bubble.appendChild(img);
  }

  if (m.role === "user") row.append(bubble, avatar);
  else row.append(avatar, bubble);
  chatMessages.appendChild(row);
}

function resizeInput() {
  if (!userInput) return;
  userInput.style.height = "auto";
  userInput.style.height = Math.min(userInput.scrollHeight, 150) + "px";
}

async function sendMessage() {
  if (isSending) return;
  let text = userInput.value.trim();
  if (!text && !selectedImage) return;

  let c = getActive();
  if (!c) {
    c = { id: makeId(), title: text ? text.slice(0, 42) : "Image", messages: [], updatedAt: Date.now() };
    conversations.unshift(c);
    activeConversationId = c.id;
  }

  const currentImage = selectedImage;
  c.messages.push({ role: "user", text: text, image: currentImage });
  if (c.messages.length === 1 && text) c.title = text.slice(0, 42);

  userInput.value = "";
  userInput.style.height = "auto";
  clearImage();
  saveAndRender();

  isSending = true;
  if (sendBtn) sendBtn.disabled = true;

  try {
    const response = await fetch("/api/ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: c.messages.map(m => ({ role: m.role === 'model' ? 'assistant' : m.role, content: m.text })),
        conversationId: c.id,
        image: currentImage // Baathna el image base64 lel backend bash el AI ta9raha!
      })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Erreur serveur.");

    if (data.choices && data.choices[0] && data.choices[0].message) {
      c.messages.push({ role: "model", text: data.choices[0].message.content, image: null });
    }
  } catch (err) {
    c.messages.push({ role: "model", text: "⚠️ **Erreur :** " + (err.message || "Connexion impossible."), image: null });
  } finally {
    isSending = false;
    if (sendBtn) sendBtn.disabled = false;
    c.updatedAt = Date.now();
    saveAndRender();
    if (userInput) userInput.focus();
  }
}

if (userInput) {
  userInput.oninput = resizeInput;
  userInput.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
}
if (sendBtn) sendBtn.onclick = sendMessage;
if ($("newChatBtn")) $("newChatBtn").onclick = () => newConversation(true);
if ($("menuBtn")) $("menuBtn").onclick = () => sidebar.classList.toggle("open");

loadConversationsFromSupabase();
</script>
</body>
</html>
