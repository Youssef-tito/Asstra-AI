<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSTRA AI</title>
    <!-- Tailwind CSS for blazing fast styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-indigo-500 bg-clip-text text-transparent">ASSTRA AI ⚡</h1>
        <span class="text-xs bg-purple-900/50 text-purple-300 px-3 py-1 rounded-full border border-purple-700/50">Flash Mode</span>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-between">
        <div id="chat-box" class="space-y-4 overflow-y-auto flex-1 mb-4 pr-2">
            <div class="flex justify-start">
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 max-w-[85%] text-sm shadow-sm">
                    مرحباً بك يا صاحبي في **ASSTRA AI**! كيف يمكنني مساعدتك اليوم بسرعة البرق؟ 🚀
                </div>
            </div>
        </div>

        <!-- Input Form -->
        <form id="chat-form" class="flex gap-2 bg-slate-900 p-2 rounded-2xl border border-slate-800 shadow-lg">
            <input 
                type="text" 
                id="user-input" 
                placeholder="اكتب رسالتك هنا..." 
                class="flex-1 bg-transparent border-none outline-none px-4 text-white text-sm placeholder-slate-500"
                autocomplete="off"
                required
            >
            <button 
                type="submit" 
                class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-6 py-2.5 rounded-xl transition-all shadow-md text-sm">
                إرسال ⚡
            </button>
        </form>
    </main>

    <!-- Script Integration -->
    <script>
        // الـ Key متاعك الي حطيتو انت
        const GEMINI_API_KEY = "AQ.Ab8RN6LakPTAa7cjj05FjXkz6yGPPsjFiMxyoLRkyEx_Ob5GGA"; 
        const MODEL_NAME = "gemini-1.5-flash";

        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            const loadingId = appendMessage('جاري التفكير...', 'bot', true);

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                removeMessage(loadingId);

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage(reply, 'bot');
                } else if (data.error) {
                    appendMessage('خطأ من الـ API: ' + (data.error.message || 'مشكل في المفتاح'), 'bot');
                } else {
                    appendMessage('عذراً، حدث خطأ في الاتصال بالنموذج.', 'bot');
                }
            } catch (err) {
                removeMessage(loadingId);
                appendMessage('تأكد من الاتصال بالإنترنت.', 'bot');
            }
        });

        function appendMessage(text, sender, isLoading = false) {
            const id = 'msg-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl p-4 max-w-[85%] text-sm shadow-sm ${
                sender === 'user' 
                ? 'bg-purple-600 text-white rounded-br-none' 
                : 'bg-slate-800 border border-slate-700 text-slate-100 rounded-bl-none'
            }`;
            bubble.innerHTML = text.replace(/\n/g, '<br>');
            
            div.appendChild(bubble);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
