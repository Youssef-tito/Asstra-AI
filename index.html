<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ASSTRA AI — Assistant Intelligent</title>

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
:root {
  --purple: #7054f7;
  --purple-dark: #5438df;
  --purple-light: #f2edff;
  --text: #252238;
  --muted: #89859b;
  --border: #ece9f5;
  --sidebar-width: 270px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  width: 100%;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #fff;
  color: var(--text);
}

body { min-height: 100vh; }
button, textarea, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app { min-height: 100vh; width: 100%; display: flex; }

.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  background: #fcfbff;
  border-right: 1px solid var(--border);
  position: fixed;
  top: 0; left: 0; bottom: 0;
  transform: translateX(-100%);
  transition: transform .3s ease;
  z-index: 1000;
}

.sidebar.open { transform: translateX(0); }

@media (min-width: 769px) {
  .sidebar { position: static; transform: translateX(0); }
  .menu-toggle-btn { display: none !important; }
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 5px 20px;
}

.brand-logo, .mobile-logo, .welcome-emblem {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  background: transparent;
}

.brand-logo svg, .mobile-logo svg, .welcome-emblem svg { width: 100%; height: 100%; }

.brand-name { font-size: 20px; font-weight: 850; letter-spacing: -.8px; }

.gradient-text {
  color: var(--purple);
  background: linear-gradient(100deg, #a18aff, #6844f1, #bb69f7);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-caption { margin-top: 2px; font-size: 10px; color: var(--muted); }

.primary-button {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 44px;
  padding: 10px;
  border-radius: 12px;
  color: #fff;
  background: linear-gradient(110deg, #8e75ff, #6545ec);
  box-shadow: 0 5px 15px rgba(112, 84, 247, .2);
  font-size: 13px;
  font-weight: 700;
  border: 0;
  cursor: pointer;
}

.sidebar-nav-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 12px;
  margin-top: 5px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #555168;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.sidebar-nav-btn:hover { background: #f2edff; color: var(--purple); }

.sidebar-section-title {
  margin: 18px 7px 8px;
  color: #aaa5bb;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.2px;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 38vh;
  overflow-y: auto;
}

.history-item {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px;
  border-radius: 10px;
}

.history-item.active { background: #f0ecff; }

.history-item-title {
  flex: 1;
  min-width: 0;
  padding: 7px 8px;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  border: 0;
  background: transparent;
  color: #555168;
  cursor: pointer;
  font-size: 12px;
}

.history-delete {
  width: 24px;
  height: 24px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #a09aae;
  cursor: pointer;
}

.sidebar-spacer { flex: 1; min-height: 15px; }

.creator-card {
  padding: 12px;
  border: 1px solid #e9e2ff;
  border-radius: 14px;
  background: linear-gradient(145deg, #fff, #f5f1ff);
}

.creator-card strong { color: var(--purple); font-size: 11px; }
.creator-card p { margin: 4px 0 0; color: #817b96; font-size: 10px; line-height: 1.5; }

.main {
  flex: 1;
  width: 100%;
  min-width: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  min-height: 70px;
  width: 100%;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid #f0edf7;
  background: rgba(255,255,255,.95);
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar-left { display: flex; align-items: center; gap: 8px; }

.menu-toggle-btn {
  background: transparent;
  border: 0;
  font-size: 22px;
  color: var(--text);
  cursor: pointer;
  padding: 2px;
}

.topbar-title { font-size: 14px; font-weight: 800; }

.topbar-status {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 2px;
  color: #9892a9;
  font-size: 10px;
}

.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #40c994; }

.topbar-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.secondary-button {
  min-height: 32px;
  padding: 6px 9px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: #625c76;
  font-size: 11px;
  font-weight: 650;
  cursor: pointer;
  white-space: nowrap;
}

.btn-header-install {
  background: linear-gradient(110deg, #8e75ff, #6545ec) !important;
  color: white !important;
  border: 0 !important;
}

.user-avatar-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(145deg, #a18aff, #6745ed);
  color: white;
  font-weight: 800;
  font-size: 13px;
  display: grid;
  place-items: center;
  cursor: pointer;
}

.content {
  width: 100%;
  max-width: 100%;
  margin: 0 auto;
  padding: 25px 16px 20px;
  flex: 1;
}

.welcome { width: 100%; max-width: 100%; margin: 0 auto; text-align: center; }
.welcome-emblem { width: 60px; height: 60px; margin: 0 auto 15px; }

.eyebrow {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  color: var(--purple);
  font-size: 10px;
  font-weight: 800;
}

.welcome h1 {
  margin: 12px 0 20px;
  font-size: clamp(22px, 4vw, 34px);
  line-height: 1.2;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px;
  margin-top: 20px;
  width: 100%;
}

@media (max-width: 600px) {
  .suggestions { grid-template-columns: 1fr; }
}

.suggestion {
  min-height: 100px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  text-align: left;
  border: 1px solid #eeebf7;
  border-radius: 14px;
  background: #fff;
  cursor: pointer;
}

.suggestion strong { font-size: 12px; margin-bottom: 4px; }
.suggestion span { color: var(--muted); font-size: 11px; }

.messages { display: flex; flex-direction: column; gap: 16px; width: 100%; padding-bottom: 20px; }

.message { display: flex; align-items: flex-start; gap: 10px; width: 100%; }
.message.user { flex-direction: row-reverse; justify-content: flex-start; }
.message.assistant { justify-content: flex-start; }

.avatar {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: linear-gradient(145deg, #a18aff, #6745ed);
  color: white;
  font-weight: 800;
  font-size: 13px;
}

.message.user .avatar { background: #eeeaff; color: #7054f7; }

.bubble {
  min-width: 0;
  width: 100%;
  max-width: 100%;
  padding: 12px 16px;
  border: 1px solid #efedf6;
  border-radius: 4px 14px 14px 14px;
  background: white;
  color: #373348;
  font-size: 13px;
  line-height: 1.7;
}

.message.user .bubble { background: #f5f2ff; border-color: #ebe5ff; border-radius: 14px 4px 14px 14px; }

.composer-wrap {
  position: sticky;
  bottom: 0;
  z-index: 5;
  width: 100%;
  padding: 10px 16px 12px;
  background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 20%);
}

.composer {
  width: 100%;
  max-width: 100%;
  margin: 0 auto;
  padding: 12px 14px 10px;
  border: 1px solid #e6e0f5;
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 5px 25px rgba(60,40,120,.07);
}

#promptInput {
  width: 100%;
  min-height: 38px;
  max-height: 140px;
  resize: none;
  border: 0;
  outline: 0;
  padding: 4px;
  background: transparent;
  font-size: 13px;
}

.composer-tools {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  padding-top: 6px;
  border-top: 1px solid #f2eff8;
}

.tool-button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 32px;
  padding: 6px 10px;
  border: 1px solid #ece8f6;
  border-radius: 9px;
  background: white;
  color: #716b85;
  font-size: 11px;
  font-weight: 650;
  cursor: pointer;
}

.send-button {
  width: 35px;
  height: 35px;
  margin-left: auto;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: linear-gradient(145deg, #8f76ff, #6344ec);
  color: white;
  font-size: 20px;
  border: 0;
  cursor: pointer;
}

.attachment-preview {
  display: none;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  padding: 6px;
  border: 1px solid #eae4ff;
  border-radius: 10px;
  background: #faf8ff;
  width: 100%;
}

.attachment-preview.visible { display: flex; }
.attachment-preview img { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(37, 34, 56, 0.5);
  backdrop-filter: blur(4px);
  z-index: 2000;
  display: grid;
  place-items: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.modal-backdrop.visible { opacity: 1; pointer-events: auto; }

.custom-modal {
  width: min(400px, 100%);
  background: #fff;
  border-radius: 20px;
  padding: 24px 20px;
  box-shadow: 0 15px 40px rgba(61, 39, 130, 0.2);
}

.custom-modal h3 { margin: 0 0 8px; font-size: 17px; font-weight: 800; }
.custom-modal p { margin: 0 0 15px; color: var(--muted); font-size: 12px; line-height: 1.5; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 80px;
  z-index: 3000;
  padding: 10px 15px;
  border-radius: 11px;
  background: white;
  box-shadow: 0 6px 25px rgba(40,20,90,.15);
  font-size: 12px;
  opacity: 0;
  transform: translate(-50%, 8px);
  transition: .2s ease;
}

.toast.visible { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 225 100 C 240 85, 260 85, 275 100 L 380 280 C 388 293, 378 310, 362 310 L 322 310 L 282 230 L 218 230 L 182 310 L 142 310 Z" fill="url(#aGrad)"/>
          <path d="M 100 300 C 190 325, 310 320, 375 235 C 405 195, 412 155, 395 130 C 355 230, 185 305, 100 300 Z" fill="url(#orbitGrad)"/>
          <path d="M 390 90 C 390 115, 370 135, 345 135 C 370 135, 390 155, 390 180 C 390 155, 410 135, 435 135 C 410 135, 390 115, 390 90 Z" fill="#b066ff"/>
          <defs>
            <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a044ff" /><stop offset="100%" stop-color="#00d2ff" /></linearGradient>
            <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7036ff" /><stop offset="100%" stop-color="#387fff" /></linearGradient>
          </defs>
        </svg>
      </div>
      <div>
        <div class="brand-name">ASSTRA <span class="gradient-text">AI</span></div>
        <div class="brand-caption">Assistant intelligent</div>
      </div>
    </div>

    <button class="primary-button" id="sidebarNewChatBtn" type="button">＋ Nouvelle discussion</button>
    <button class="sidebar-nav-btn" id="navFavorites" type="button">⭐ Favoris</button>
    <button class="sidebar-nav-btn" id="navFiles" type="button">📁 Fichiers</button>

    <div class="sidebar-section-title">VOS DISCUSSIONS</div>
    <div class="history-list" id="historyList"></div>

    <div class="sidebar-spacer"></div>
    <div class="creator-card">
      <strong>✦ ASSTRA AI</strong>
      <p>Créé par Youssef.</p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle-btn" id="menuToggleBtn" type="button">☰</button>
        <div>
          <div class="topbar-title">ASSTRA AI <span class="gradient-text">Premium</span></div>
          <div class="topbar-status"><span class="status-dot"></span><span id="statusText">Assistant prêt</span></div>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="secondary-button btn-connexion" id="openAuthBtn" type="button">👤 Connexion</button>
        <div class="user-avatar-btn" id="userAvatar" style="display: none;">Y</div>
        <button class="secondary-button btn-header-install" id="headerInstallBtn" type="button">📲 Installer</button>
        <button class="secondary-button" id="clearChatBtn" type="button">🗑️ Effacer</button>
        <button class="secondary-button" id="topNewChatBtn" type="button">＋ Nouveau</button>
      </div>
    </header>

    <section class="content">
      <section class="welcome" id="welcome">
        <div class="welcome-emblem">
          <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 225 100 C 240 85, 260 85, 275 100 L 380 280 C 388 293, 378 310, 362 310 L 322 310 L 282 230 L 218 230 L 182 310 L 142 310 Z" fill="url(#aGrad)"/>
            <path d="M 100 300 C 190 325, 310 320, 375 235 C 405 195, 412 155, 395 130 C 355 230, 185 305, 100 300 Z" fill="url(#orbitGrad)"/>
            <path d="M 390 90 C 390 115, 370 135, 345 135 C 370 135, 390 155, 390 180 C 390 155, 410 135, 435 135 C 410 135, 390 115, 390 90 Z" fill="#b066ff"/>
          </svg>
        </div>
        <div class="eyebrow"><span>✦</span><span>VOTRE ASSISTANT INTELLIGENT</span></div>
        <h1>Bonjour, que pouvons-nous <span class="gradient-text">créer ?</span></h1>

        <div class="suggestions">
          <button class="suggestion" data-prompt="Explique-moi un sujet difficile de façon simple.">
            <strong>✧ Apprendre quelque chose</strong>
            <span>Des explications simples et claires.</span>
          </button>
          <button class="suggestion" data-prompt="Aide-moi à trouver des idées originales pour un projet.">
            <strong>✦ Créer et imaginer</strong>
            <span>Développe tes idées créatives.</span>
          </button>
        </div>
      </section>

      <div class="messages" id="messages"></div>
      <div class="typing" id="typing" hidden>✦ ASSTRA AI réfléchit...</div>
    </section>

    <div class="composer-wrap">
      <div class="composer">
        <div class="attachment-preview" id="attachmentPreview">
          <img id="attachmentImage" alt="Aperçu">
          <span id="attachmentInfo" style="font-size:11px; color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis;"></span>
          <button id="removeAttachment" type="button" style="border:0; background:transparent; color:red; font-size:16px; cursor:pointer;">×</button>
        </div>

        <textarea id="promptInput" rows="1" placeholder="Écrivez votre message à ASSTRA AI…"></textarea>

        <div class="composer-tools">
          <button class="tool-button" id="imageButton" type="button">🖼️ Image</button>
          <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
          <button class="tool-button" id="voiceButton" type="button">🎙️ Voix</button>
          <button class="tool-button" id="clearInputBtn" type="button">🧹 Nettoyer</button>
          <button class="send-button" id="sendButton" type="button">↑</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal Pro -->
<div class="modal-backdrop" id="customModal">
  <div class="custom-modal">
    <h3 id="modalTitle">Titre</h3>
    <div id="modalBody" style="margin-bottom: 20px; font-size: 12px; color: var(--muted); max-height: 220px; overflow-y: auto;"></div>
    <button class="primary-button" id="closeModalBtn" type="button">Fermer</button>
  </div>
</div>

<!-- Modal Connexion -->
<div class="modal-backdrop" id="authModal">
  <div class="custom-modal">
    <h3>Connexion ASSTRA AI</h3>
    <p>Entrez votre email pour accéder à votre espace personnel.</p>
    <input type="email" id="authEmailInput" placeholder="votre.email@gmail.com" style="width:100%; padding:10px; margin-bottom:12px; border:1px solid var(--border); border-radius:10px; outline:none;">
    <div style="display:flex; gap:8px;">
      <button class="secondary-button" id="authCancelBtn" type="button" style="flex:1;">Annuler</button>
      <button class="primary-button" id="authSubmitBtn" type="button" style="flex:1;">Se connecter</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  const API_URL = "/api/ai";
  const STORAGE_KEY = "asstra_ai_conversations_v3";

  const $ = id => document.getElementById(id);
  const elements = {
    prompt: $("promptInput"), messages: $("messages"), welcome: $("welcome"),
    history: $("historyList"), typing: $("typing"), send: $("sendButton"),
    status: $("statusText"), imageInput: $("imageInput"), imageButton: $("imageButton"),
    attachmentPreview: $("attachmentPreview"), attachmentImage: $("attachmentImage"),
    attachmentInfo: $("attachmentInfo"), removeAttachment: $("removeAttachment"),
    toast: $("toast"), sidebar: $("sidebar"), menuToggle: $("menuToggleBtn"),
    clearChatBtn: $("clearChatBtn"), clearInputBtn: $("clearInputBtn"),
    sidebarNewChat: $("sidebarNewChatBtn"), topNewChat: $("topNewChatBtn"),
    navFavorites: $("navFavorites"), navFiles: $("navFiles"),
    customModal: $("customModal"), modalTitle: $("modalTitle"), modalBody: $("modalBody"), closeModalBtn: $("closeModalBtn"),
    openAuthBtn: $("openAuthBtn"), userAvatar: $("userAvatar"), authModal: $("authModal"),
    authEmailInput: $("authEmailInput"), authCancelBtn: $("authCancelBtn"), authSubmitBtn: $("authSubmitBtn"),
    headerInstallBtn: $("headerInstallBtn")
  };

  let conversations = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let activeId = conversations[0]?.id || null;
  let selectedImage = null;
  let isSending = false;
  let installPrompt = null;
  let currentUserEmail = localStorage.getItem("asstra_user_email") || "";

  function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function showToast(m) { elements.toast.textContent = m; elements.toast.classList.add("visible"); setTimeout(() => elements.toast.classList.remove("visible"), 3000); }

  function openModal(title, htmlContent) {
    elements.modalTitle.textContent = title;
    elements.modalBody.innerHTML = htmlContent;
    elements.customModal.classList.add("visible");
  }

  elements.closeModalBtn.onclick = () => elements.customModal.classList.remove("visible");

  function updateAuthUI() {
    if (currentUserEmail) {
      elements.openAuthBtn.style.display = "none";
      elements.userAvatar.style.display = "grid";
      elements.userAvatar.textContent = currentUserEmail.charAt(0).toUpperCase();
      elements.status.textContent = "Connecté (" + currentUserEmail + ")";
    } else {
      elements.openAuthBtn.style.display = "inline-flex";
      elements.userAvatar.style.display = "none";
      elements.status.textContent = "Assistant prêt";
    }
  }

  elements.openAuthBtn.onclick = () => elements.authModal.classList.add("visible");
  elements.authCancelBtn.onclick = () => elements.authModal.classList.remove("visible");
  elements.authSubmitBtn.onclick = () => {
    const email = elements.authEmailInput.value.trim();
    if (email) {
      currentUserEmail = email;
      localStorage.setItem("asstra_user_email", email);
      updateAuthUI();
      elements.authModal.classList.remove("visible");
      showToast("Connecté !");
    } else {
      showToast("Entrez un email valide.");
    }
  };

  elements.userAvatar.onclick = () => {
    if (confirm("Se déconnecter ?")) {
      currentUserEmail = "";
      localStorage.removeItem("asstra_user_email");
      updateAuthUI();
      showToast("Déconnecté.");
    }
  };

  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; });
  elements.headerInstallBtn.onclick = async () => {
    if (installPrompt) {
      installPrompt.prompt();
      installPrompt = null;
    } else if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
      openModal("📲 Installer sur iPhone", "<p>Appuyez sur <strong>Partager</strong> ⎘ puis <strong>Sur l'écran d'accueil</strong> ➕.</p>");
    } else {
      showToast("Déjà installé ou non supporté.");
    }
  };

  elements.navFavorites.onclick = () => openModal("⭐ Favoris", "<p>Aucun message favori.</p>");
  elements.navFiles.onclick = () => openModal("📁 Fichiers", "<p>Aucun fichier récent.</p>");

  function setBusy(busy) {
    isSending = busy;
    elements.send.disabled = busy;
    elements.imageButton.disabled = busy;
    elements.prompt.disabled = busy;
    elements.typing.hidden = !busy;
  }

  function createNewChat() {
    activeId = makeId();
    const newChat = { id: activeId, title: "Nouvelle discussion", messages: [] };
    conversations.unshift(newChat);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
    renderHistory();
    renderMessages();
    if (window.innerWidth <= 768) elements.sidebar.classList.remove("open");
  }

  function renderHistory() {
    elements.history.replaceChildren();
    conversations.forEach(chat => {
      const row = document.createElement("div");
      row.className = "history-item" + (chat.id === activeId ? " active" : "");
      row.innerHTML = `<button class="history-item-title">${chat.title}</button><button class="history-delete">×</button>`;
      row.querySelector(".history-item-title").onclick = () => { 
        activeId = chat.id; 
        renderMessages(); 
        renderHistory(); 
        if (window.innerWidth <= 768) elements.sidebar.classList.remove("open");
      };
      row.querySelector(".history-delete").onclick = (e) => {
        e.stopPropagation();
        conversations = conversations.filter(c => c.id !== chat.id);
        activeId = conversations[0]?.id || null;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
        renderHistory();
        renderMessages();
      };
      elements.history.appendChild(row);
    });
  }

  function renderMessages() {
    elements.messages.replaceChildren();
    const chat = conversations.find(c => c.id === activeId);
    elements.welcome.hidden = Boolean(chat && chat.messages.length);

    if (chat) {
      chat.messages.forEach(msg => {
        const row = document.createElement("article");
        row.className = "message " + msg.role;
        row.innerHTML = `<div class="avatar">${msg.role === 'assistant' ? '✦' : 'Y'}</div><div class="bubble">${marked.parse(msg.content)}</div>`;
        elements.messages.appendChild(row);
      });
    }
  }

  async function sendMessage() {
    if (isSending) return;
    const text = elements.prompt.value.trim();
    if (!text && !selectedImage) return;

    let chat = conversations.find(c => c.id === activeId);
    if (!chat) {
      activeId = makeId();
      chat = { id: activeId, title: text.slice(0, 25) || "Discussion", messages: [] };
      conversations.unshift(chat);
    }

    if (chat.title === "Nouvelle discussion" && text) {
      chat.title = text.length > 22 ? text.slice(0, 22) + "..." : text;
    }

    chat.messages.push({ role: "user", content: text || "Analyse cette image." });
    const imgToSend = selectedImage;
    elements.prompt.value = "";
    selectedImage = null;
    elements.attachmentPreview.classList.remove("visible");

    renderHistory();
    renderMessages();
    setBusy(true);

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: chat.messages, image: imgToSend })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erreur serveur.");

      const answer = data.choices?.[0]?.message?.content;
      chat.messages.push({ role: "assistant", content: answer });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
      renderHistory();
      renderMessages();

    } catch (e) {
      chat.messages.push({ role: "assistant", content: "⚠️ " + e.message });
      renderMessages();
    } finally {
      setBusy(false);
      elements.prompt.focus();
    }
  }

  elements.sidebarNewChat.onclick = createNewChat;
  elements.topNewChat.onclick = createNewChat;
  elements.clearInputBtn.onclick = () => { elements.prompt.value = ""; elements.prompt.focus(); };
  elements.menuToggle.onclick = () => elements.sidebar.classList.toggle("open");

  elements.clearChatBtn.onclick = () => {
    if (confirm("Effacer cette discussion ?")) {
      conversations = conversations.filter(c => c.id !== activeId);
      activeId = conversations[0]?.id || null;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
      renderMessages();
      renderHistory();
      showToast("Effacée.");
    }
  };

  elements.imageButton.onclick = () => elements.imageInput.click();
  elements.imageInput.onchange = e => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = () => {
        selectedImage = reader.result;
        elements.attachmentImage.src = selectedImage;
        elements.attachmentInfo.textContent = file.name;
        elements.attachmentPreview.classList.add("visible");
      };
      reader.readAsDataURL(file);
    }
  };

  elements.removeAttachment.onclick = () => {
    selectedImage = null;
    elements.attachmentPreview.classList.remove("visible");
  };

  elements.send.onclick = sendMessage;
  elements.prompt.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };

  updateAuthUI();
  if (conversations.length === 0) createNewChat();
  renderHistory();
  renderMessages();
})();
</script>
</body>
</html>
