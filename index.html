<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="ASSTRA AI, votre assistant intelligent créé par Youssef.">
<title>ASSTRA AI — Assistant Intelligent</title>

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
:root {
  --purple: #7054f7;
  --purple-dark: #5438df;
  --purple-light: #f2edff;
  --text: #252238;
  --muted: #89859b;
  --border: #ece9f5;
  --white: #ffffff;
  --sidebar-width: 270px;
  --shadow: 0 12px 40px rgba(61, 39, 130, .08);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #fff;
  color: var(--text);
}

body { min-height: 100vh; }

button, textarea, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app { min-height: 100vh; display: flex; }

.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  background: #fcfbff;
  border-right: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 12px; padding: 4px 5px 25px; }

.brand-logo {
  width: 47px;
  height: 47px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 16px;
  color: white;
  background: linear-gradient(145deg, #a28cff, #6745ed 65%, #4e32ce);
  box-shadow: 0 5px 22px rgba(112, 84, 247, .38);
}

.brand-logo svg { width: 29px; height: 29px; }

.brand-name { font-size: 21px; font-weight: 850; letter-spacing: -.8px; }

.gradient-text {
  color: var(--purple);
  background: linear-gradient(100deg, #a18aff, #6844f1, #bb69f7);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-caption { margin-top: 3px; font-size: 11px; color: var(--muted); }

.primary-button, .secondary-button, .tool-button, .send-button {
  border: 0; cursor: pointer; transition: .2s ease;
}

.primary-button {
  display: flex; justify-content: center; align-items: center; gap: 9px;
  width: 100%; min-height: 47px; padding: 12px; border-radius: 14px;
  color: #fff; background: linear-gradient(110deg, #8e75ff, #6545ec);
  box-shadow: 0 6px 17px rgba(112, 84, 247, .2); font-size: 13px; font-weight: 700;
}

.sidebar-section-title { margin: 29px 7px 12px; color: #aaa5bb; font-size: 10px; font-weight: 800; letter-spacing: 1.2px; }
.history-list { display: flex; flex-direction: column; gap: 5px; max-height: 45vh; overflow-y: auto; }
.history-item { display: flex; align-items: center; gap: 4px; padding: 3px; border-radius: 11px; }
.history-item.active { background: #f0ecff; }

.history-item-title {
  flex: 1; min-width: 0; padding: 9px 7px; text-align: left;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border: 0; background: transparent; color: #555168; cursor: pointer; font-size: 12px;
}

.history-delete { width: 27px; height: 27px; border: 0; border-radius: 7px; background: transparent; color: #a09aae; cursor: pointer; }
.history-delete:hover { color: #e04462; background: #fff; }

.sidebar-spacer { flex: 1; min-height: 30px; }

.creator-card {
  padding: 15px; border: 1px solid #e9e2ff; border-radius: 16px;
  background: linear-gradient(145deg, #fff, #f5f1ff);
}
.creator-card strong { color: var(--purple); font-size: 12px; }
.creator-card p { margin: 8px 0 0; color: #817b96; font-size: 11px; line-height: 1.7; }

.sidebar-footer { display: flex; justify-content: space-between; gap: 8px; margin: 19px 3px 0; color: #aaa5b7; font-size: 9px; }

.main { flex: 1; min-width: 0; min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  min-height: 76px; padding: 15px 30px; display: flex;
  align-items: center; justify-content: space-between; gap: 15px;
  border-bottom: 1px solid #f0edf7; background: rgba(255,255,255,.94);
}

.topbar-left { display: flex; align-items: center; gap: 11px; }
.topbar-title { font-size: 16px; font-weight: 800; }
.topbar-status { display: flex; align-items: center; gap: 7px; margin-top: 5px; color: #9892a9; font-size: 11px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #40c994; box-shadow: 0 0 8px rgba(64,201,148,.5); }

.topbar-actions { display: flex; gap: 8px; align-items: center; }

.secondary-button {
  min-height: 38px; padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 11px; background: white; color: #625c76; font-size: 11px; font-weight: 650;
}

.btn-header-install {
  background: linear-gradient(110deg, #8e75ff, #6545ec) !important; color: white !important; border: 0 !important;
}

.btn-connexion { background: var(--purple-light) !important; color: var(--purple) !important; border-color: #ded1ff !important; }

/* USER AVATAR BUTTON */
.user-avatar-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(145deg, #a18aff, #6745ed);
  color: white; font-weight: 800; font-size: 15px;
  display: grid; place-items: center; cursor: pointer; border: 2px solid #fff;
  box-shadow: 0 4px 12px rgba(112,84,247,.25); text-transform: uppercase;
}

.content { width: 100%; max-width: 1000px; margin: 0 auto; padding: 42px 28px 30px; flex: 1; }
.welcome { max-width: 790px; margin: 0 auto; }
.welcome-emblem {
  width: 68px; height: 68px; margin: 0 auto 20px; display: grid; place-items: center;
  border-radius: 23px; background: linear-gradient(145deg, #a18bff, #6744ee 70%, #4f31d0);
  box-shadow: 0 9px 35px rgba(112,84,247,.29);
}
.welcome-emblem svg { width: 43px; height: 43px; }

.eyebrow { display: flex; justify-content: center; align-items: center; gap: 7px; color: var(--purple); font-size: 10px; font-weight: 800; }
.welcome h1 { margin: 16px 0 13px; text-align: center; font-size: clamp(27px, 4vw, 42px); line-height: 1.2; }
.welcome-description { max-width: 560px; margin: 0 auto; text-align: center; color: #858096; font-size: 13px; line-height: 1.9; }

.suggestions-heading { margin: 34px 0 14px; color: #777188; font-size: 11px; font-weight: 750; }
.suggestions { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.suggestion {
  min-height: 118px; padding: 17px; display: flex; flex-direction: column;
  align-items: flex-start; border: 1px solid #eeebf7; border-radius: 17px; background: #fff; cursor: pointer;
}

.messages { display: flex; flex-direction: column; gap: 20px; padding-bottom: 20px; }
.message { display: flex; align-items: flex-start; gap: 12px; }
.message.user { flex-direction: row-reverse; align-self: flex-end; }
.message.assistant { align-self: flex-start; }

.avatar {
  width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center;
  border-radius: 12px; background: linear-gradient(145deg, #a18aff, #6745ed); color: white; font-size: 15px; font-weight: 800;
}
.message.user .avatar { background: #eeeaff; color: #7054f7; }

.bubble {
  max-width: min(760px, calc(100% - 45px)); padding: 15px 18px; border: 1px solid #efedf6;
  border-radius: 4px 17px 17px 17px; background: white; color: #373348; font-size: 13px; line-height: 1.85;
}
.message.user .bubble { background: #f5f2ff; border-color: #ebe5ff; border-radius: 17px 4px 17px 17px; }

.typing { display: flex; align-items: center; gap: 10px; padding: 8px 0 18px; color: #8c86a1; font-size: 12px; }
.typing[hidden] { display: none; }

.composer-wrap { position: sticky; bottom: 0; z-index: 5; padding: 12px 25px 10px; background: #fff; }
.composer {
  width: 100%; max-width: 900px; margin: 0 auto; padding: 14px 15px 12px;
  border: 1px solid #e6e0f5; border-radius: 20px; background: #fff;
}

#promptInput { width: 100%; min-height: 40px; max-height: 160px; resize: none; border: 0; outline: 0; font-size: 13px; }
.composer-tools { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid #f2eff8; }

.send-button {
  width: 37px; height: 37px; display: grid; place-items: center;
  border-radius: 12px; background: linear-gradient(145deg, #8f76ff, #6344ec); color: white; font-size: 22px; margin-left: auto;
}

.install-modal-backdrop {
  position: fixed; inset: 0; background: rgba(37, 34, 56, 0.45);
  backdrop-filter: blur(5px); z-index: 9999; display: grid; place-items: center;
  padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
}
.install-modal-backdrop.visible { opacity: 1; pointer-events: auto; }

.install-modal { width: min(420px, 100%); background: #fff; border-radius: 24px; padding: 28px 24px; text-align: center; }
.install-modal-icon { width: 60px; height: 60px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 20px; background: linear-gradient(145deg, #a28cff, #6745ed); color: white; }

.install-modal-actions { display: flex; gap: 10px; }
.install-modal-btn { flex: 1; min-height: 44px; border: 0; border-radius: 13px; font-weight: 750; font-size: 13px; cursor: pointer; }
.btn-refuse { background: #f2efec; color: #625c76; }
.btn-install { background: linear-gradient(110deg, #8e75ff, #6545ec); color: white; }

.toast {
  position: fixed; left: 50%; bottom: 85px; z-index: 30; padding: 12px 17px;
  border-radius: 13px; background: white; color: #4b4266; box-shadow: 0 8px 30px rgba(40,20,90,.13);
  font-size: 12px; opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: .2s ease;
}
.toast.visible { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M50 5 L62 38 L95 50 L62 62 L50 95 L38 62 L5 50 L38 38 Z" fill="white"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">ASSTRA <span class="gradient-text">AI</span></div>
        <div class="brand-caption">Assistant intelligent</div>
      </div>
    </div>

    <button class="primary-button" id="newChatButton" type="button"><span>＋</span> Nouvelle discussion</button>
    <div class="sidebar-section-title">VOS DISCUSSIONS</div>
    <div class="history-list" id="historyList"></div>
    <div class="sidebar-spacer"></div>

    <div class="creator-card">
      <strong>✦ ASSTRA AI</strong>
      <p>Un assistant intelligent créé par Youssef.</p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div>
          <div class="topbar-title">ASSTRA AI <span class="gradient-text">Premium</span></div>
          <div class="topbar-status"><span class="status-dot"></span><span id="statusText">Assistant prêt</span></div>
        </div>
      </div>

      <div class="topbar-actions">
        <!-- Dynamic Auth Button / Avatar -->
        <button class="secondary-button btn-connexion" id="openAuthBtn" type="button">👤 Connexion</button>
        <div class="user-avatar-btn" id="userAvatar" style="display: none;" title="Mon Compte / Déconnexion">Y</div>

        <button class="secondary-button btn-header-install" id="headerInstallBtn" type="button">📲 Installer</button>
        <button class="secondary-button" id="exportButton" type="button">⇩ Exporter</button>
      </div>
    </header>

    <section class="content">
      <section class="welcome" id="welcome">
        <div class="welcome-emblem">
          <svg viewBox="0 0 100 100" fill="none"><path d="M50 5 L62 38 L95 50 L62 62 L50 95 L38 62 L5 50 L38 38 Z" fill="white"/></svg>
        </div>
        <h1>Bonjour, que pouvons-nous <span class="gradient-text">créer ?</span></h1>
      </section>

      <div class="messages" id="messages"></div>

      <div class="typing" id="typing" hidden>
        <div class="avatar">✦</div>
        <span>ASSTRA AI réfléchit...</span>
      </div>
    </section>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="promptInput" rows="1" placeholder="Écrivez votre message à ASSTRA AI…"></textarea>
        <div class="composer-tools">
          <button class="send-button" id="sendButton" type="button">↑</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal Inscription / Connexion -->
<div class="install-modal-backdrop" id="authModalBackdrop">
  <div class="install-modal">
    <div class="install-modal-icon">✦</div>
    <h3 id="authTitle">Connexion à ASSTRA AI</h3>
    <p id="authDesc">Entrez votre email et mot de passe pour sauvegarder vos accès.</p>
    
    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
      <input type="email" id="authEmail" placeholder="Votre email" style="padding: 12px; border: 1px solid var(--border); border-radius: 12px; font-size: 13px; outline: none;">
      <input type="password" id="authPassword" placeholder="Votre mot de passe" style="padding: 12px; border: 1px solid var(--border); border-radius: 12px; font-size: 13px; outline: none;">
    </div>

    <div class="install-modal-actions">
      <button class="install-modal-btn btn-refuse" id="authSwitchBtn" type="button">Créer un compte</button>
      <button class="install-modal-btn btn-install" id="authSubmitBtn" type="button">Se connecter</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const API_URL = "/api/ai";
  const $ = id => document.getElementById(id);

  const elements = {
    prompt: $("promptInput"),
    messages: $("messages"),
    welcome: $("welcome"),
    typing: $("typing"),
    send: $("sendButton"),
    status: $("statusText"),
    toast: $("toast"),
    openAuthBtn: $("openAuthBtn"),
    userAvatar: $("userAvatar"),
    authModal: $("authModalBackdrop"),
    authEmail: $("authEmail"),
    authPassword: $("authPassword"),
    authSubmit: $("authSubmitBtn"),
    authSwitch: $("authSwitchBtn"),
    authTitle: $("authTitle"),
    authDesc: $("authDesc")
  };

  let currentUserEmail = localStorage.getItem("asstra_user_email") || "";
  let isSignUpMode = false;
  let messages = [];

  function showToast(msg) {
    elements.toast.textContent = msg;
    elements.toast.classList.add("visible");
    setTimeout(() => elements.toast.classList.remove("visible"), 3200);
  }

  function updateUIForAuth() {
    if (currentUserEmail) {
      elements.openAuthBtn.style.display = "none";
      elements.userAvatar.style.display = "grid";
      elements.userAvatar.textContent = currentUserEmail.charAt(0).toUpperCase();
      elements.status.textContent = "Connecté (" + currentUserEmail + ")";
    } else {
      elements.openAuthBtn.style.display = "inline-flex";
      elements.userAvatar.style.display = "none";
      elements.status.textContent = "Assistant prêt";
    }
  }

  elements.openAuthBtn.addEventListener("click", () => {
    elements.authModal.classList.add("visible");
  });

  elements.userAvatar.addEventListener("click", () => {
    if (confirm("Voulez-vous vous déconnecter de (" + currentUserEmail + ") ?")) {
      currentUserEmail = "";
      localStorage.removeItem("asstra_user_email");
      updateUIForAuth();
      showToast("Déconnecté.");
    }
  });

  elements.authSwitch.addEventListener("click", () => {
    isSignUpMode = !isSignUpMode;
    elements.authTitle.textContent = isSignUpMode ? "Créer un compte" : "Connexion à ASSTRA AI";
    elements.authSubmit.textContent = isSignUpMode ? "S'inscrire" : "Se connecter";
    elements.authSwitch.textContent = isSignUpMode ? "Se connecter" : "Créer un compte";
  });

  elements.authSubmit.addEventListener("click", async () => {
    const email = elements.authEmail.value.trim();
    const password = elements.authPassword.value.trim();

    if (!email || !password) return showToast("Remplissez tous les champs.");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "auth", isSignUp: isSignUpMode, email, password })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      currentUserEmail = email;
      localStorage.setItem("asstra_user_email", email);
      updateUIForAuth();
      elements.authModal.classList.remove("visible");
      showToast(data.message);

    } catch (err) {
      showToast(err.message);
    }
  });

  async function sendMessage() {
    const text = elements.prompt.value.trim();
    if (!text) return;

    elements.welcome.hidden = true;
    messages.push({ role: "user", content: text });
    
    // Render Message User
    const userDiv = document.createElement("div");
    userDiv.className = "message user";
    userDiv.innerHTML = `<div class="avatar">${currentUserEmail ? currentUserEmail.charAt(0).toUpperCase() : "Y"}</div><div class="bubble">${text}</div>`;
    elements.messages.appendChild(userDiv);

    elements.prompt.value = "";
    elements.typing.hidden = false;

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages, email: currentUserEmail })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      const reply = data.choices[0].message.content;
      messages.push({ role: "assistant", content: reply });

      const aiDiv = document.createElement("div");
      aiDiv.className = "message assistant";
      aiDiv.innerHTML = `<div class="avatar">✦</div><div class="bubble">${reply}</div>`;
      elements.messages.appendChild(aiDiv);

    } catch (err) {
      showToast(err.message);
    } finally {
      elements.typing.hidden = true;
    }
  }

  elements.send.addEventListener("click", sendMessage);
  elements.prompt.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

  updateUIForAuth();
})();
</script>
</body>
</html>
