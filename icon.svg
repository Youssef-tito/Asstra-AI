<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a17" />
      <stop offset="100%" stop-color="#05040a" />
    </linearGradient>

    <!-- Gradient A -->
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a044ff" />
      <stop offset="50%" stop-color="#6a4eff" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <!-- Gradient Orbit & Star -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7036ff" />
      <stop offset="60%" stop-color="#387fff" />
      <stop offset="100%" stop-color="#b066ff" />
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <g filter="url(#softGlow)">
    <!-- 1. Letter A -->
    <path d="M 225 75 
             C 240 60, 260 60, 275 75 
             L 380 245 
             C 388 258, 378 275, 362 275 
             L 322 275 
             L 282 200 
             L 218 200 
             L 182 275 
             L 142 275 
             C 126 275, 116 258, 124 245 Z
             M 250 130 
             L 232 170 
             L 268 170 Z" fill="url(#aGrad)" />

    <!-- 2. Orbit -->
    <path d="M 100 265 
             C 190 290, 310 285, 375 200 
             C 405 160, 412 120, 395 95 
             C 385 80, 375 90, 382 103 
             C 395 125, 385 160, 355 195 
             C 295 265, 185 270, 100 265 Z" fill="url(#orbitGrad)" />

    <!-- 3. AI Star -->
    <path d="M 390 55
             C 390 80, 370 100, 345 100
             C 370 100, 390 120, 390 145
             C 390 120, 410 100, 435 100
             C 410 100, 390 80, 390 55 Z" fill="url(#orbitGrad)" />

    <!-- 4. Text ASSTRA -->
    <text x="256" y="380" font-family="System-UI, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="62" fill="#ffffff" text-anchor="middle" letter-spacing="5">ASSTRA</text>

    <!-- 5. Text AI -->
    <text x="256" y="445" font-family="System-UI, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="800" font-size="42" fill="url(#aGrad)" text-anchor="middle" letter-spacing="3">AI</text>
  </g>
</svg>
