<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B69AFF"/>
      <stop offset="50%" stop-color="#8660FF"/>
      <stop offset="100%" stop-color="#542BE0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="#FFFFFF"/>

  <rect x="28" y="28" width="456" height="456" rx="100"
        fill="url(#purple)" opacity="0.12"/>

  <path d="M256 65
           L300 195
           L430 239
           L300 283
           L256 413
           L212 283
           L82 239
           L212 195 Z"
        fill="url(#purple)"
        filter="url(#glow)"/>

  <circle cx="365" cy="137" r="13" fill="#B69AFF"/>
  <circle cx="145" cy="355" r="9" fill="#8660FF"/>

  <text x="256" y="455"
        font-family="Arial, sans-serif"
        font-size="43"
        font-weight="900"
        text-anchor="middle"
        fill="#5B35D5">ASSTRA</text>
</svg>
