<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Premium -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0b18" />
      <stop offset="100%" stop-color="#05040a" />
    </linearGradient>

    <!-- Gradient A -->
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a044ff" />
      <stop offset="50%" stop-color="#6a4eff" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <!-- Gradient Orbit & Star -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7036ff" />
      <stop offset="60%" stop-color="#387fff" />
      <stop offset="100%" stop-color="#b066ff" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <g filter="url(#softGlow)">
    <!-- 1. Forme Principale : La Lettre A Stylisée -->
    <path d="M 225 90 
             C 240 75, 260 75, 275 90 
             L 380 270 
             C 388 283, 378 300, 362 300 
             L 322 300 
             L 282 220 
             L 218 220 
             L 182 300 
             L 142 300 
             C 126 300, 116 283, 124 270 Z
             M 250 150 
             L 232 190 
             L 268 190 Z" fill="url(#aGrad)" />

    <!-- 2. Orbite Traversante -->
    <path d="M 100 290 
             C 190 315, 310 310, 375 225 
             C 405 185, 412 145, 395 120 
             C 385 105, 375 115, 382 128 
             C 395 150, 385 185, 355 220 
             C 295 290, 185 295, 100 290 Z" fill="url(#orbitGrad)" />

    <!-- 3. Étoile IA Lumineuse -->
    <path d="M 390 80
             C 390 105, 370 125, 345 125
             C 370 125, 390 145, 390 170
             C 390 145, 410 125, 435 125
             C 410 125, 390 105, 390 80 Z" fill="url(#orbitGrad)" />

    <!-- 4. Texte ASSTRA -->
    <text x="256" y="390" font-family="System-UI, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="60" fill="#ffffff" text-anchor="middle" letter-spacing="5">ASSTRA</text>

    <!-- 5. Texte AI -->
    <text x="256" y="450" font-family="System-UI, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="800" font-size="40" fill="url(#aGrad)" text-anchor="middle" letter-spacing="3">AI</text>
  </g>
</svg>
